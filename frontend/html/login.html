<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HMA</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
    <header class="header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="./index.html">HMA</a>
            <div class="nav-buttons">
                <a href="./register.html" class="register-button">Create account</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <span class="eyebrow">Welcome back</span>
                <h1>Login to HMA.</h1>
                <p>Sign in to manage your teams, submissions, and hackathons.</p>
                <form id="loginForm" class="login-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="username" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>

                    <button type="submit" class="primary-button" id="loginButton">Log in</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="../js/scripts.js"></script>
</body>
</html>
